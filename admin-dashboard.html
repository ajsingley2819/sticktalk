<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Stick Talk</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Playfair+Display&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    .dashboard-container {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 100vh;
      position: relative;
      z-index: 2;
    }

    .sidebar {
      background-color: #3c2b1d;
      padding: 2rem 0;
      color: #fff6da;
      position: fixed;
      height: 100vh;
      width: 250px;
      overflow-y: auto;
    }

    .sidebar-brand {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 2rem;
      color: #d1a338;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu li {
      padding: 0;
    }

    .sidebar-menu a {
      display: block;
      padding: 1rem 1.5rem;
      color: #fff6da;
      text-decoration: none;
      transition: all 0.3s ease;
      border-left: 3px solid transparent;
    }

    .sidebar-menu a:hover,
    .sidebar-menu a.active {
      background-color: #4a7c59;
      border-left-color: #d1a338;
    }

    .main-content {
      margin-left: 250px;
      padding: 2rem;
      background-color: #f6e5b5;
    }

    .header-bar {
      background-color: #3c2b1d;
      color: #fff6da;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-left: -250px;
      margin-right: -2rem;
      margin-top: -2rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logout-btn {
      background-color: #872e24;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background-color: #a63a2e;
    }

    .content-section {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .content-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .upload-form {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 600px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #3c2b1d;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.8rem;
      border: 2px solid #d1a338;
      border-radius: 5px;
      font-family: inherit;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .submit-btn {
      background: linear-gradient(90deg, #4a7c59 60%, #c8e6c8 100%);
      color: #fff6da;
      border: none;
      padding: 1rem 2rem;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(90deg, #2d5a3d 60%, #4a7c59 100%);
      transform: translateY(-2px);
    }

    .success-message,
    .error-message {
      padding: 1rem;
      border-radius: 5px;
      margin-bottom: 1rem;
      display: none;
    }

    .success-message {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error-message {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .articles-list {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .article-item {
      padding: 1.5rem;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .article-item:last-child {
      border-bottom: none;
    }

    .article-info h3 {
      margin: 0 0 0.5rem 0;
      color: #3c2b1d;
    }

    .article-info p {
      margin: 0;
      color: #666;
      font-size: 0.9rem;
    }

    .article-actions {
      display: flex;
      gap: 0.5rem;
    }

    .delete-btn {
      background-color: #872e24;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .delete-btn:hover {
      background-color: #a63a2e;
    }

    @media (max-width: 768px) {
      .dashboard-container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: absolute;
        width: 200px;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .main-content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">Stick Talk</div>
      <ul class="sidebar-menu">
        <li><a href="#" class="menu-link active" data-section="upload">Upload Article</a></li>
        <li><a href="#" class="menu-link" data-section="articles">My Articles</a></li>
        <li><a href="#" class="menu-link" data-section="settings">Settings</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="header-bar">
        <h1 style="margin: 0;">Admin Dashboard</h1>
        <div class="user-info">
          <span id="userEmail">Loading...</span>
          <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
      </div>

      <!-- Upload Section -->
      <section class="content-section active" id="upload">
        <h2>Upload New Article</h2>
        <div class="upload-form">
          <div class="success-message" id="successMessage">Article saved successfully!</div>
          <div class="error-message" id="errorMessage"></div>

          <form id="articleForm">
            <div class="form-group">
              <label for="title">Article Title</label>
              <input type="text" id="title" required placeholder="Enter article title">
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="">Select a category...</option>
                <option value="puckfessor">The Puckfessor (Hockey)</option>
                <option value="strokologist">Dr. Strokologist (Golf)</option>
                <option value="about">About the Boys</option>
              </select>
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" required placeholder="Brief description of the article"></textarea>
            </div>

            <div class="form-group">
              <label for="articleLink">Article Link (Google Doc, PDF, or any URL)</label>
              <input type="url" id="articleLink" required placeholder="https://...">
            </div>

            <button type="submit" class="submit-btn">Save Article</button>
          </form>
        </div>
      </section>

      <!-- Articles Section -->
      <section class="content-section" id="articles">
        <h2>My Articles</h2>
        <div id="articlesList" class="articles-list">
          <p style="padding: 2rem; text-align: center; color: #999;">Loading articles...</p>
        </div>
      </section>

      <!-- Settings Section -->
      <section class="content-section" id="settings">
        <h2>Settings</h2>
        <div style="background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
          <p>Account information and preferences coming soon.</p>
          <p><strong>Account Type:</strong> <span id="accountType">Loading...</span></p>
        </div>
      </section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    let currentUser = null;
    let userType = null;

    // Check if user is logged in
    firebase.auth().onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = user;
      document.getElementById('userEmail').textContent = user.email;
      
      // Determine user type
      if (user.email.includes('puckfessor')) {
        userType = 'puckfessor';
        document.getElementById('accountType').textContent = 'The Puckfessor (Hockey)';
      } else if (user.email.includes('strokologist')) {
        userType = 'strokologist';
        document.getElementById('accountType').textContent = 'Dr. Strokologist (Golf)';
      } else {
        userType = 'admin';
        document.getElementById('accountType').textContent = 'Admin';
      }

      loadUserArticles();
    });

    // Menu navigation
    document.querySelectorAll('.menu-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        
        document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');

        document.querySelectorAll('.content-section').forEach(section => {
          section.classList.remove('active');
        });

        const section = link.getAttribute('data-section');
        document.getElementById(section).classList.add('active');
      });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await firebase.auth().signOut();
        window.location.href = 'index.html';
      } catch (error) {
        console.error('Logout error:', error);
      }
    });

    // Article submit
    document.getElementById('articleForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const articleLink = document.getElementById('articleLink').value;

      const successMsg = document.getElementById('successMessage');
      const errorMsg = document.getElementById('errorMessage');
      const submitBtn = e.target.querySelector('.submit-btn');

      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';

        await firebase.firestore().collection('articles').add({
          title: title,
          description: description,
          category: category,
          fileUrl: articleLink,
          author: currentUser.email,
          authorType: userType,
          createdAt: new Date(),
          updatedAt: new Date()
        });

        successMsg.style.display = 'block';
        document.getElementById('articleForm').reset();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Article';

        setTimeout(() => loadUserArticles(), 1000);

      } catch (error) {
        errorMsg.textContent = 'Error saving article: ' + error.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Article';
      }
    });

    // Load user's articles
    async function loadUserArticles() {
      try {
        const articlesCollection = firebase.firestore().collection('articles');
        const query = articlesCollection.where('author', '==', currentUser.email);
        const snapshot = await query.get();

        const articlesList = document.getElementById('articlesList');

        if (snapshot.empty) {
          articlesList.innerHTML = '<p style="padding: 2rem; text-align: center; color: #999;">No articles yet. Create your first one!</p>';
          return;
        }

        articlesList.innerHTML = '';

        snapshot.forEach((doc) => {
          const article = doc.data();
          const date = article.createdAt.toDate().toLocaleDateString();

          const articleItem = document.createElement('div');
          articleItem.className = 'article-item';
          articleItem.innerHTML = `
            <div class="article-info">
              <h3>${article.title}</h3>
              <p>${article.description}</p>
              <p style="font-size: 0.8rem; margin-top: 0.5rem;">Category: <strong>${article.category}</strong> | Created: ${date}</p>
            </div>
            <div class="article-actions">
              <a href="${article.fileUrl}" target="_blank" style="padding: 0.5rem 1rem; background-color: #4a7c59; color: white; text-decoration: none; border-radius: 5px; font-size: 0.9rem;">View</a>
              <button class="delete-btn" onclick="deleteArticle('${doc.id}')">Delete</button>
            </div>
          `;

          articlesList.appendChild(articleItem);
        });

      } catch (error) {
        console.error('Error loading articles:', error);
        document.getElementById('articlesList').innerHTML = '<p style="padding: 2rem; color: red;">Error loading articles</p>';
      }
    }

    // Delete article
    async function deleteArticle(docId) {
      if (!confirm('Are you sure you want to delete this article?')) return;

      try {
        await firebase.firestore().collection('articles').doc(docId).delete();
        loadUserArticles();
      } catch (error) {
        alert('Error deleting article: ' + error.message);
      }
    }
  </script>
</body>
</html>
