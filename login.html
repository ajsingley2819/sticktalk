<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Stick Talk Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Playfair+Display&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f6e5b5 0%, #e6cfa1 100%);
      position: relative;
      z-index: 2;
    }

    .login-card {
      background: white;
      padding: 3rem;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    .login-card h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #3c2b1d;
      text-align: center;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 8px #3c2b1d, 0 0 10px #d1a338;
    }

    .login-card p {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #3c2b1d;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.8rem;
      border: 2px solid #d1a338;
      border-radius: 5px;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4a7c59;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(90deg, #4a7c59 60%, #c8e6c8 100%);
      color: #fff6da;
      border: none;
      border-radius: 5px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      background: linear-gradient(90deg, #2d5a3d 60%, #4a7c59 100%);
      transform: translateY(-2px);
    }

    .error-message {
      color: #c33;
      background: #ffe6e6;
      padding: 1rem;
      border-radius: 5px;
      margin-bottom: 1rem;
      display: none;
    }

    .account-info {
      background: #f0f0f0;
      padding: 1rem;
      border-radius: 5px;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .account-info strong {
      display: block;
      color: #3c2b1d;
      margin-bottom: 0.5rem;
    }

    .account-info code {
      background: white;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-family: monospace;
    }

    .loading {
      display: none;
      text-align: center;
      color: #666;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #4a7c59;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="grass-container" aria-hidden="true"></div>
  <div class="snowflakes" aria-hidden="true">
    <span class="snowflake">❄</span>
    <span class="snowflake">❅</span>
    <span class="snowflake">❆</span>
    <span class="snowflake">❄</span>
    <span class="snowflake">❅</span>
    <span class="snowflake">❆</span>
    <span class="snowflake">❄</span>
    <span class="snowflake">❅</span>
    <span class="snowflake">❆</span>
    <span class="snowflake">❄</span>
    <span class="snowflake">❅</span>
    <span class="snowflake">❆</span>
    <span class="snowflake">❄</span>
    <span class="snowflake">❅</span>
    <span class="snowflake">❆</span>
    <span class="snowflake">❄</span>
    <span class="snowflake">❅</span>
    <span class="snowflake">❆</span>
    <span class="snowflake">❄</span>
    <span class="snowflake">❅</span>
  </div>

  <div class="login-container">
    <div class="login-card">
      <h1>Stick Talk</h1>
      <p>Admin Login</p>

      <div class="error-message" id="errorMessage"></div>

      <div class="account-info">
        <strong>Demo Accounts:</strong>
        <div>
          <code>puckfessor@sticktalk.com</code> / <code>password123</code>
        </div>
        <div>
          <code>strokologist@sticktalk.com</code> / <code>password123</code>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="your-email@sticktalk.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Login</button>
      </form>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Logging in...</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
  <script src="firebase-config.js"></script>
  <script src="grass.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMessage');
      const loading = document.getElementById('loading');
      const loginBtn = document.getElementById('loginBtn');

      errorMsg.style.display = 'none';
      loading.style.display = 'block';
      loginBtn.disabled = true;

      try {
        const result = await firebase.auth().signInWithEmailAndPassword(email, password);
        console.log('Logged in:', result.user.email);
        window.location.href = 'admin-dashboard.html';
      } catch (error) {
        errorMsg.textContent = 'Login failed: ' + error.message;
        errorMsg.style.display = 'block';
        loading.style.display = 'none';
        loginBtn.disabled = false;
      }
    });

    // Check if already logged in
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'admin-dashboard.html';
      }
    });
  </script>
</body>
</html>
